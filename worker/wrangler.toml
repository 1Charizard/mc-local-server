name = "mc1life-api"
main = "src/index.js"
compatibility_date = "2024-06-01"

# 生产 secrets 通过 wrangler secret put 注入 (不要写死明文)
[vars]
ALLOWED_AGENT_ID = "mc1life"

# R2 未启用 (导出存档走 KV 分片中转, 不依赖 R2)
#[[r2_buckets]]
#binding = "BACKUP_BUCKET"
#bucket_name = "mc1life-backups"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "487f8a6d4a324c92a707bfb60d756404"

[[d1_databases]]
binding = "DB"
database_name = "mc1life"
database_id = "9de1aabd-3526-470d-915a-563122590175"

